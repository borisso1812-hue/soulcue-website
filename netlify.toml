# Link headers for AI agent discovery (RFC 8288)
[[headers]]
  for = "/"
  [headers.values]
    Link = "</about.html>; rel=\"about\", </sitemap.xml>; rel=\"sitemap\""
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Robots-Tag = "index, follow"

# Force HTTPS and non-www
[[redirects]]
  from = "http://www.soulcue.org/*"
  to = "https://soulcue.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.soulcue.org/*"
  to = "https://soulcue.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://soulcue.org/*"
  to = "https://soulcue.org/:splat"
  status = 301
  force = true

