# Force HTTPS and non-www
[[redirects]]
  from = "http://www.soulcue.org/*"
  to = "https://soulcue.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.soulcue.org/*"
  to = "https://soulcue.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://soulcue.org/*"
  to = "https://soulcue.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
